[project]
name = "kitta"
version = "0.1.0"
description = "Compare AI background removal models side by side. Fully offline."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "rembg>=2.0.66",
    "onnxruntime>=1.19",
    # 11.3 is the first release whose wheels can decode AVIF (Qt cannot)
    "pillow>=11.3",
    # numba (via rembg -> pymatting) does not support the newest numpy yet
    "numpy>=1.26,<2.3",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
kitta = "kitta.cli.main:main"

[project.gui-scripts]
kitta-gui = "kitta.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.uv]
# Keep the resolver away from ancient numba releases that no longer build
# (pulled in via rembg -> pymatting).
constraint-dependencies = ["numba>=0.60"]

[tool.pyappdist]
name = "Kitta"
python = "3.12"
identifier = "com.github.atsuoishimoto.kitta"

[[tool.pyappdist.launchers]]
name = "kitta-gui"
entry = "kitta.gui.app:main"
gui = true
icon = { windows = "assets/kitta.ico", macos = "assets/kitta.png", linux = "assets/kitta.png" }

[[tool.pyappdist.launchers]]
name = "kitta"
entry = "kitta.cli.main:main"

[[tool.pyappdist.targets]]
name = "windows"
platform = "windows-x86_64"
format = "msix"
extras = ["gui"]
manufacturer = "Atsuo Ishimoto"
logo = "assets/kitta.png"
app-execution-alias = true

[[tool.pyappdist.targets]]
name = "macos"
platform = "macos-aarch64"
format = "pkg"
extras = ["gui"]
# license = "LICENSE"  # pyappdist 0.11.0 only accepts .rtf here (docs say txt/rtf/html)

[[tool.pyappdist.targets]]
name = "linux"
platform = "linux-x86_64"
format = "linux"
extras = ["gui"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not inference'"
markers = [
    "network: requires network access (deselected by default)",
    "inference: runs real model inference (deselected by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
