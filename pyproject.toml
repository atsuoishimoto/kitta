[project]
name = "kitta"
version = "0.1.0"
description = "Compare AI background removal models side by side. Fully offline."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # 11.3 is the first release whose wheels can decode AVIF (Qt cannot)
    "pillow>=11.3",
    "rembg-directml[cpu,cli]>=1.1.0 ; sys_platform != 'win32'",
    "rembg-directml[dml,cli]>=1.1.0 ; sys_platform == 'win32'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
kitta = "kitta.cli.main:main"

[project.gui-scripts]
kitta-gui = "kitta.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]


[tool.pyappdist]
name = "Kitta Background Remover"
python = "3.12"
identifier = "com.github.atsuoishimoto.kitta"

[[tool.pyappdist.launchers]]
title = "Kitta"
name = "Kitta"
entry = "kitta.gui.app:main"
gui = true
icon = { windows = "assets/kitta.ico", macos = "assets/kitta.png", linux = "assets/kitta.png" }

[[tool.pyappdist.launchers]]
name = "kitta"
entry = "kitta.cli.main:main"
app-entry = false
icon = { windows = "assets/kitta.ico" }

[[tool.pyappdist.targets]]
name = "windows"
platform = "windows-x86_64"
format = "msix"
extras = ["gui"]
manufacturer = "Atsuo Ishimoto"
logo = "assets/kitta.png"
app-execution-alias = true

[[tool.pyappdist.targets]]
name = "windows-msi"
platform = "windows-x86_64"
format = "msi"
extras = ["gui"]
manufacturer = "Atsuo Ishimoto"
# Must stay stable for the life of the product; auto-write-back would not
# survive a CI build, so it is fixed here.
upgrade-code = "2446630D-5CB4-4286-9DDE-B4D732A10EBD"
add-to-path = true
license = "assets/LICENSE.rtf"

[[tool.pyappdist.targets]]
name = "macos"
platform = "macos-aarch64"
format = "pkg"
extras = ["gui"]
# .txt license needs pyappdist >= 0.12; LICENSE.txt is a symlink to LICENSE
license = "LICENSE.txt"
# numba/llvmlite JITs at runtime; the hardened runtime kills the process
# (SIGKILL: Code Signature Invalid) without the JIT entitlements.
entitlements = "assets/entitlements.plist"

[[tool.pyappdist.targets]]
name = "linux"
platform = "linux-x86_64"
format = "linux"
extras = ["gui"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not inference'"
markers = [
    "network: requires network access (deselected by default)",
    "inference: runs real model inference (deselected by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
