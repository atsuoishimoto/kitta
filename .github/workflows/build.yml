name: Build

on:
  workflow_dispatch:

jobs:
  check-release:
    # A tag run uploads into an existing release; verify it exists before
    # spending build minutes. Non-tag runs have nothing to check, so the
    # step is skipped and the job succeeds.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check release exists
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"

  build:
    needs: check-release
    strategy:
      # A failing cell (e.g. macOS missing its signing secrets) must not cancel
      # the other builds.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: windows-latest
            target: windows-msi
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # The macOS signing secrets live in the `sign_macos` environment; only the
    # macOS cell enters it (an empty environment = none), so Windows/Linux runs
    # never touch it.
    environment: ${{ startsWith(matrix.os, 'macos') && 'sign_macos' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # WiX (for the MSI) is a dotnet global tool; the UI extension supplies
      # WixUI_Minimal, which the generated .wxs uses because the msi target
      # sets a license file.
      - name: Install WiX
        if: matrix.target == 'windows-msi'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      # --- macOS code-signing + notarization --------------------------------
      # All secrets below are required (checked first thing); a missing one
      # fails this cell — the other matrix cells keep building (fail-fast off).
      # Secrets are referenced only in this macOS-only step, never on the
      # Windows/Linux cells.
      #
      # Required GitHub Actions secrets (in the `sign_macos` environment):
      #
      #   MACOS_CERTIFICATE_P12
      #     The "Developer ID Application" certificate + private key, exported
      #     from Keychain Access as .p12 and base64-encoded.
      #   MACOS_CERTIFICATE_PASSWORD
      #     The password set when exporting that .p12.
      #   MACOS_SIGNING_IDENTITY
      #     The identity's full name, e.g.
      #     "Developer ID Application: Your Name (TEAMID)".
      #
      #   MACOS_INSTALLER_CERTIFICATE_P12
      #   MACOS_INSTALLER_CERTIFICATE_PASSWORD
      #   MACOS_INSTALLER_IDENTITY
      #     Same three for the "Developer ID Installer" certificate — a .pkg is
      #     signed with a different certificate type than the .app bundles
      #     inside it, and needs both to be notarized.
      #     e.g. "Developer ID Installer: Your Name (TEAMID)".
      #
      #   MACOS_NOTARY_APPLE_ID
      #     The Apple ID email (Apple Developer account).
      #   MACOS_NOTARY_TEAM_ID
      #     The 10-char Developer Team ID.
      #   MACOS_NOTARY_PASSWORD
      #     An app-specific password (NOT the Apple ID password).
      #
      # The temporary keychain's password is generated fresh each run below, so
      # it is deliberately NOT a secret.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          # Every signing/notarization secret is mandatory; list what's missing
          # and fail before touching the keychain.
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
                      MACOS_SIGNING_IDENTITY MACOS_INSTALLER_CERTIFICATE_P12 \
                      MACOS_INSTALLER_CERTIFICATE_PASSWORD MACOS_INSTALLER_IDENTITY \
                      MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secrets in the sign_macos environment:$missing"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          INSTALLER_CERT="$RUNNER_TEMP/installer-cert.p12"
          # Disposable password for the throwaway keychain — never leaves this step.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          echo "$MACOS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$INSTALLER_CERT"

          # Create + unlock a temp keychain and add it to the search list
          # (alongside login, where the notary profile below is stored).
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          # The Developer ID Installer certificate (pkg signing) lands in the
          # same keychain; productbuild/productsign need explicit -T entries of
          # their own to reach its private key.
          security import "$INSTALLER_CERT" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/productbuild -T /usr/bin/productsign

          # Let codesign/productbuild use the private keys without an
          # interactive prompt. This applies to every key in the keychain, so it
          # runs once after both imports; `apple:` covers productbuild, which is
          # an Apple-signed tool.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Create the notarytool keychain profile pyappdist expects. Omitting
          # --keychain stores it in the default login keychain, which pyappdist
          # reads back (also without --keychain).
          xcrun notarytool store-credentials pyappdist-notary \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"

          # Hand the identities + notary profile to the build step. The
          # Application identity signs the .app bundles; the Installer one
          # signs the .pkg itself — a pkg needs both to be notarized. Exported
          # here (macOS only) so the build step itself references no secrets.
          {
            echo "PYAPPDIST_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
            echo "PYAPPDIST_MACOS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY"
            echo "PYAPPDIST_MACOS_NOTARY_PROFILE=pyappdist-notary"
          } >> "$GITHUB_ENV"

      - name: Build installer
        # >= 0.12 for the .txt pkg license
        run: uvx "pyappdist>=0.13" build ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kitta-${{ matrix.target }}
          path: appdist/${{ matrix.target }}/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets (overwrite)
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
