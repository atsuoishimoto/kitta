name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build installer
        run: uvx pyappdist build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: kitta-${{ matrix.target }}
          path: appdist/${{ matrix.target }}/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check release exists
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets (overwrite)
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
