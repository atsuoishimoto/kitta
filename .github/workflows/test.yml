name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .kitta-models
          key: kitta-models-${{ runner.os }}-u2netp
      - name: Test (network / inference)
        run: uv run pytest -m "network or inference"
        env:
          KITTA_MODEL_DIR: ${{ github.workspace }}/.kitta-models
